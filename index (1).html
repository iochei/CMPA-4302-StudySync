<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudySync</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172b40;font:16px system-ui}header{background:#173d42;color:white;padding:24px 7%;display:flex;justify-content:space-between}main{max-width:900px;margin:28px auto;padding:0 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button{cursor:pointer;border:0;border-radius:8px;padding:12px 16px;font:inherit;background:#e3ecec;color:#173d42}button.primary,button.active{background:#17685f;color:white}section{background:white;border:1px solid #dce4e8;border-radius:14px;padding:24px;margin:16px 0}h1{font-size:30px;margin:0 0 8px}h2{font-size:20px}p{line-height:1.5;color:#536575}label{display:block;margin:12px 0}input,select{font:inherit;padding:9px;border:1px solid #aab9c3;border-radius:6px;max-width:100%}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.line>*{flex:1}.tag{color:#17685f;font-weight:600}.warn{color:#9b4a13}small{color:#536575}article{padding:14px 0;border-bottom:1px solid #e2e8ec}footer{margin-top:20px;color:#536575;font-size:13px}</style><header><strong>StudySync</strong><span>Working student planner · Demo week</span></header><main><nav id="nav"></nav><div id="screen"></div><footer>Interactive concept prototype · fictional sample data · changes last for this session</footer></main><script>
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let hours=[1,2,1,2,1,3,3],tasks=[{name:'Database exercise',due:2,need:2},{name:'Design reflection',due:4,need:3},{name:'Reading quiz',due:6,need:2}],view=0;const names=['Overview','Work schedule','Assignments','Study plan','Adjust plan'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(i){view=i;render()}function plan(){let free=[...hours],blocks=[],missing=[];for(const t of [...tasks].sort((a,b)=>a.due-b.due)){let left=t.need;for(let d=0;d<=t.due&&left>0;d++){let n=Math.min(free[d],left);if(n){blocks.push({day:d,name:t.name,n});free[d]-=n;left-=n}}if(left)missing.push(`${t.name}: ${left} hour(s) unscheduled`)}return {blocks,missing}}function render(){nav.innerHTML=names.map((n,i)=>`<button class="${view===i?'active':''}" onclick="go(${i})">${n}</button>`).join('');let p=plan(),s='';if(view===0)s=`<h1>Make room for school.</h1><p>Build a study week that fits around your job.</p><section><div class="line"><div><small>Available study time</small><h1>${hours.reduce((a,b)=>a+b,0)}h</h1></div><div><small>Upcoming assignments</small><h1>${tasks.length}</h1></div><div><small>Planned study time</small><h1>${p.blocks.reduce((a,b)=>a+b.n,0)}h</h1></div></div></section><section><h2>Your next step</h2><p>Enter the hours you can realistically study after work, commuting and rest.</p><button class="primary" onclick="go(1)">Set my availability</button></section>`;if(view===1||view===4)s=`<h1>${view===1?'Work schedule & availability':'Adjust your study plan'}</h1><p>${view===1?'Estimate free study hours after your work shifts and other commitments.':'Working late? Reduce your available hours and rebuild your plan.'}</p><section>${days.map((d,i)=>`<label class="line"><span>${d}</span><input aria-label="${d} study hours" type="number" min="0" max="12" step="1" value="${hours[i]}" onchange="hours[${i}]=Math.max(0,Math.min(12,Math.round(Number(this.value)||0)))"><small>study hours</small></label>`).join('')}<button class="primary" onclick="go(${view===1?2:3})">${view===1?'Continue to assignments':'Rebuild study plan'}</button></section>`;if(view===2)s=`<h1>Upcoming assignments</h1><p>Enter deadlines and estimated study effort.</p><section>${tasks.map((t,i)=>`<article><strong>${esc(t.name)}</strong><p>Due ${days[t.due]} · ${t.need}h estimated <button onclick="tasks.splice(${i},1);render()">Remove</button></p></article>`).join('')}<h2>Add an assignment</h2><form onsubmit="event.preventDefault();tasks.push({name:document.getElementById('task').value,due:Number(document.getElementById('due').value),need:Number(document.getElementById('effort').value)});render()"><label>Assignment <input id="task" required maxlength="80"></label><label>Due <select id="due">${days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><label>Estimated hours <input id="effort" type="number" min="1" max="30" value="2" required></label><button>Add assignment</button></form><p><button class="primary" onclick="go(3)">Generate study plan</button></p></section>`;if(view===3)s=`<h1>Your study plan</h1><p>Earlier deadlines are scheduled first, within your available hours.</p><section>${p.missing.length?`<p class="warn">Not enough time: ${p.missing.map(esc).join('; ')}. Adjust availability or assignment estimates.</p>`:'<p class="tag">All estimated study hours fit before deadlines.</p>'}${days.map((d,i)=>`<article><strong>${d}</strong><small> · ${hours[i]}h available</small>${p.blocks.filter(b=>b.day===i).map(b=>`<p>${esc(b.name)} · ${b.n}h</p>`).join('')||'<p>No study blocks planned</p>'}</article>`).join('')}<p><button class="primary" onclick="go(4)">My work schedule changed</button></p></section>`;document.getElementById("screen").innerHTML=s}render();</script></html>
